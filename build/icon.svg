<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Ikon aplikasi SayGumi! Photobooth.
       Gaya pixel 8-bit dengan palet tema Candy, mengikuti identitas visual kiosk:
       primary #007CC3, secondary #FFD453, accent #FF3B67, garis tegas hitam. -->

  <!-- Latar -->
  <rect width="64" height="64" fill="#007CC3"/>

  <!-- Kisi halus seperti tekstur casing konsol -->
  <g fill="#ffffff" opacity="0.06">
    <rect x="0" y="8" width="64" height="1"/>
    <rect x="0" y="20" width="64" height="1"/>
    <rect x="0" y="44" width="64" height="1"/>
    <rect x="0" y="56" width="64" height="1"/>
    <rect x="8" y="0" width="1" height="64"/>
    <rect x="20" y="0" width="1" height="64"/>
    <rect x="44" y="0" width="1" height="64"/>
    <rect x="56" y="0" width="1" height="64"/>
  </g>

  <!-- Bayangan tegas ala hard-shadow 8-bit -->
  <rect x="12" y="20" width="42" height="30" fill="#000000"/>

  <!-- Badan kamera -->
  <rect x="9" y="17" width="42" height="30" fill="#FFD453"/>
  <rect x="9" y="17" width="42" height="30" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Jendela bidik atas -->
  <rect x="20" y="11" width="14" height="6" fill="#FFD453"/>
  <rect x="20" y="11" width="14" height="6" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Lensa -->
  <circle cx="30" cy="32" r="11" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="30" cy="32" r="6" fill="#007CC3" stroke="#000000" stroke-width="2"/>
  <rect x="26" y="27" width="3" height="3" fill="#ffffff"/>

  <!-- Lampu kilat -->
  <rect x="41" y="22" width="6" height="5" fill="#FF3B67" stroke="#000000" stroke-width="2"/>

  <!-- Lembar foto yang keluar dari mesin -->
  <rect x="16" y="47" width="30" height="11" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="20" y="51" width="9" height="4" fill="#FF3B67"/>
  <rect x="32" y="51" width="9" height="4" fill="#007CC3"/>
</svg>
